# InsightFlow -- full stack.
#
#   docker compose up --build
#   open http://localhost:8080
#
# Services talk to each other by service name on the internal network.
# Never localhost: inside a container that would mean the container itself.

name: insightflow

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: insightflow-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      research:
        condition: service_started
      content:
        condition: service_started
    networks:
      - insightflow
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightflow-frontend
    expose:
      - "80"
    networks:
      - insightflow
    restart: unless-stopped

  research:
    build:
      context: ./services/research
      dockerfile: Dockerfile
    container_name: insightflow-research
    expose:
      - "8001"
    ports:
      # Exposed directly so /docs is reachable during development.
      - "${RESEARCH_PORT:-8001}:8001"
    environment:
      LLM_MODEL: ${LLM_MODEL:-groq/openai/gpt-oss-120b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.4}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OFFLINE_MODE: ${OFFLINE_MODE:-}
    networks:
      - insightflow
    restart: unless-stopped

  content:
    build:
      context: ./services/content
      dockerfile: Dockerfile
    container_name: insightflow-content
    expose:
      - "8002"
    ports:
      - "${CONTENT_PORT:-8002}:8002"
    environment:
      LLM_MODEL: ${LLM_MODEL:-groq/openai/gpt-oss-120b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.6}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OFFLINE_MODE: ${OFFLINE_MODE:-}
      # Cross-module dependency, by service name on this network.
      RESEARCH_SERVICE_URL: http://research:8001
      RESEARCH_TIMEOUT: ${RESEARCH_TIMEOUT:-180}
    depends_on:
      research:
        condition: service_started
    networks:
      - insightflow
    restart: unless-stopped

  # Optional model proxy. The services call the provider directly unless
  # LITELLM_BASE_URL is set to http://litellm:4000.
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.57.0
    container_name: insightflow-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    expose:
      - "4000"
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./llm/litellm.yaml:/app/config.yaml:ro
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-insightflow-local}
    networks:
      - insightflow
    restart: unless-stopped

networks:
  insightflow:
    driver: bridge
