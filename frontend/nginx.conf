# Static file server for the built SPA. The public reverse proxy sits in front
# of this and handles /api routing.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
