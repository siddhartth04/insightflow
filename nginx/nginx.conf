# InsightFlow -- public reverse proxy.
#
#   /                 -> frontend (static SPA)
#   /api/research/*   -> research:8001
#   /api/content/*    -> content:8002

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Agent workflows run for a while; allow generous upstream timeouts.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    log_format  main  '$remote_addr - $status "$request" ${body_bytes_sent}b ${request_time}s';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # Docker's embedded DNS, so upstreams resolve as containers restart.
    resolver 127.0.0.11 valid=15s ipv6=off;

    upstream research_service {
        server research:8001;
    }

    upstream content_service {
        server content:8002;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;

        # --- Research API -------------------------------------------------
        location /api/research/ {
            proxy_pass         http://research_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
        }

        # --- Content API --------------------------------------------------
        location /api/content/ {
            proxy_pass         http://content_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
        }

        # --- Frontend -----------------------------------------------------
        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
